<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn tập trước quiz · Prototype A/B/C</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f6fb; --card:#ffffff; --ink:#1b2230; --muted:#5a6477; --line:#dce1ea;
  --brand:#3652d9; --brand-soft:#e8edff; --ok:#1c7a46; --ok-soft:#e2f4ea;
  --warn:#8f5200; --warn-soft:#fff2d4; --bad:#b3261e; --bad-soft:#fde7e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:700}
.brand span{font-weight:400;color:var(--muted)}
#seg{display:flex;gap:6px;margin:0 auto}
.seg{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;color:var(--ink)}
.seg.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;color:var(--muted)}
.task{margin:14px 20px 0;padding:12px 16px;background:var(--brand-soft);border:1px solid #cdd7ff;border-radius:10px}
.task b{color:var(--brand)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;padding:16px 20px 60px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.slide{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 26px;min-height:300px}
.slide .meta{color:var(--muted);font-size:13px;margin-bottom:6px}
.slide h1{font-size:22px;margin:0 0 12px}
.slide ul,.slide ol{margin:6px 0 0;padding-left:20px}
.slide li{margin:6px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.flow .st{background:var(--brand-soft);border:1px solid #cdd7ff;border-radius:8px;padding:6px 10px;font-size:14px}
.flow .ar{color:var(--muted)}
.navrow{display:flex;justify-content:space-between;margin:10px 0}
.navrow button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.navrow button:disabled{opacity:.4;cursor:default}
.quiz,.card,.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.quiz h2,.pcard h2{font-size:16px;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;margin:6px 0}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.primary{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 16px}
.primary:disabled{opacity:.45;cursor:default}
.sec{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;margin:4px 6px 4px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;margin:4px 6px 4px 0}
.chip.sel{background:var(--brand-soft);border-color:var(--brand)}
.muted{color:var(--muted)} .small{font-size:13px}
.field{margin:12px 0}
.field>label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{min-height:76px;resize:vertical}
.pill{display:inline-block;background:#eef1f7;border-radius:999px;padding:2px 10px;font-size:13px}
.preview{background:#f1f3f9;border-radius:8px;padding:8px 12px;font-size:13px;margin:10px 0}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin-bottom:6px}
.badge.high{background:var(--ok-soft);color:var(--ok)}
.badge.mid{background:var(--warn-soft);color:var(--warn)}
.badge.low{background:var(--bad-soft);color:var(--bad)}
.caveat{background:var(--warn-soft);border-radius:8px;padding:6px 10px;font-size:13px}
.src{font-size:13px;color:var(--muted)}
.signal{background:#f1f3f9;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.ok{border-color:#b5e0c6;background:var(--ok-soft)}
.bad{border-color:#f1b5b0;background:var(--bad-soft)}
.coach{border-left:4px solid var(--brand)}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;padding:0}
.stack{display:flex;flex-direction:column;gap:12px}
.nudge{position:fixed;right:20px;bottom:20px;width:min(380px,calc(100vw - 40px));background:#fff;border:1px solid var(--brand);border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(20,30,70,.18);z-index:20;animation:up .25s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.nudge .why{background:#f1f3f9;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.nudge .why ul{margin:4px 0;padding-left:18px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.logp{position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:#10131c;color:#dfe5f5;font:12px/1.5 ui-monospace,Consolas,monospace;padding:10px 16px;z-index:50}
.logp button{margin-right:8px}
.done{margin-top:12px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">VLearn <span>· Ôn tập trước quiz</span></div>
  <nav id="seg" aria-label="Chọn phương án"></nav>
  <button class="ghost" data-act="reset">↺ Làm lại từ đầu</button>
</header>

<section class="task" id="task"></section>

<main class="grid">
  <section class="stack">
    <div>
      <article class="slide" id="slide"></article>
      <div class="navrow" id="navrow"></div>
    </div>
    <section class="quiz" id="quiz"></section>
    <section id="done"></section>
  </section>
  <aside id="panel" aria-live="polite"></aside>
</main>

<div id="nudge" class="nudge" hidden></div>
<div id="logp" class="logp" hidden></div>

<script>
/* ============ Cấu hình (URL): ?t=20 giây dừng ở slide 6 để phương án C gợi ý · ?order=BCA thứ tự nút · ?opt=B mở thẳng · ?log=1 hiện nhật ký ============ */
const params = new URLSearchParams(location.search);
const DWELL = Math.max(3, parseInt(params.get('t') || '20', 10) || 20);
let ORDER = (params.get('order') || 'ABC').toUpperCase().split('');
if (ORDER.length !== 3 || new Set(ORDER).size !== 3 || ORDER.some(c => !'ABC'.includes(c))) ORDER = ['A','B','C'];
const START_OPT = 'ABC'.includes((params.get('opt')||'').toUpperCase()) && params.get('opt') ? params.get('opt').toUpperCase() : ORDER[0];

/* ============ Nội dung dùng chung (fixture ~70%) ============ */
const SLIDES = {
  5: { title:'Giới hạn của LLM', body:`
      <ul>
        <li>Kiến thức dừng ở thời điểm huấn luyện, không tự cập nhật.</li>
        <li>Có thể “bịa” câu trả lời khi thiếu thông tin (hallucination).</li>
        <li>Không biết dữ liệu nội bộ của tổ chức.</li>
      </ul>` },
  6: { title:'RAG — Retrieval-Augmented Generation', body:`
      <ul>
        <li>Kết hợp <b>truy xuất</b> (retrieval) và <b>sinh văn bản</b> (generation) để LLM trả lời dựa trên tài liệu bên ngoài.</li>
        <li>Giảm hallucination; cập nhật tri thức mà không cần huấn luyện lại mô hình.</li>
        <li>Thành phần: kho tài liệu · vector store · LLM.</li>
      </ul>` },
  7: { title:'Pipeline của một hệ thống RAG', body:`
      <div class="flow">
        <span class="st">1 Câu hỏi</span><span class="ar">→</span>
        <span class="st">2 Embedding</span><span class="ar">→</span>
        <span class="st">3 Vector search</span><span class="ar">→</span>
        <span class="st">4 Top-k chunks</span><span class="ar">→</span>
        <span class="st">5 Prompt + LLM</span><span class="ar">→</span>
        <span class="st">6 Câu trả lời</span>
      </div>
      <ul>
        <li>Câu hỏi và tài liệu được chuyển thành vector (embedding).</li>
        <li>Vector search chọn các chunk gần câu hỏi nhất (top-k).</li>
        <li>Các chunk được ghép vào prompt trước khi LLM sinh câu trả lời.</li>
      </ul>` }
};
const CROWD = {5:2, 6:12, 7:5};  // số liệu minh hoạ cho phương án B (không phải dữ liệu thật)
const QUIZ = {
  q:'Trong một hệ thống RAG, bước nào diễn ra trước khi LLM viết câu trả lời?',
  opts:[
    'Huấn luyện lại toàn bộ LLM trên câu hỏi của người dùng',
    'Tìm các đoạn tài liệu liên quan tới câu hỏi và đưa vào prompt',
    'Xoá toàn bộ lịch sử hội thoại của người dùng',
    'Nén mô hình để chạy nhanh hơn'
  ],
  correct:1
};
const TERMS = {
  rag:{label:'Retrieval-Augmented Generation (RAG)', src:'Slide 6, dòng 1–2', conf:'high',
    text:'RAG nghĩa là “tra tài liệu trước, rồi mới trả lời”. Thay vì chỉ dựa vào những gì mô hình đã học, hệ thống (1) tìm các đoạn tài liệu liên quan tới câu hỏi, (2) đưa các đoạn đó vào prompt cùng với câu hỏi, (3) để LLM viết câu trả lời dựa trên các đoạn đó. Giống như làm bài thi được mở sách: bạn lật đúng trang trước khi viết đáp án.'},
  emb:{label:'Embedding / vector search', src:'Slide 7, bước 2–3', conf:'high',
    text:'Embedding biến một đoạn văn thành một dãy số (vector) sao cho các đoạn có nghĩa gần nhau thì vector cũng gần nhau. Vector search là bước so khoảng cách giữa vector của câu hỏi với vector của các đoạn tài liệu để tìm ra những đoạn gần nhất.'},
  topk:{label:'Top-k chunks', src:'Slide 7, bước 4', conf:'mid',
    text:'Top-k chunks là k đoạn tài liệu (chunk) giống câu hỏi nhất sau bước vector search. Ví dụ k = 3 nghĩa là lấy 3 đoạn gần nhất rồi đưa vào prompt.',
    caveat:'Slide chưa nói cách chọn k. Giá trị k tuỳ từng hệ thống — nên xác nhận với coach.'},
  none:{label:'', src:'Không tìm thấy trong slide 5–7', conf:'low',
    text:'Mình chưa tìm thấy phần này trong slide 5–7 nên chưa chắc về câu trả lời. Bạn thử chọn một thuật ngữ gợi ý hoặc nhờ coach.'}
};
const CONF = {high:'Cao', mid:'Trung bình', low:'Thấp'};
const COACH_REPLY = 'Chào bạn, RAG hiểu đơn giản là “cho mô hình mở sách khi trả lời”. Bạn xem lại sơ đồ ở slide 7: câu hỏi → tìm đoạn tài liệu liên quan → đưa vào prompt → LLM trả lời. Nếu còn chỗ nào mơ hồ, bạn nhắn lại mình nhé.';

/* ============ Trạng thái ============ */
const LOG = [];
const TRIED = new Set();
let timers = [];
let S = fresh(START_OPT);

function fresh(opt){
  return {
    opt, t0: Date.now(), slide: 6, visits:{5:0,6:1,7:0}, dwell:0,
    q:{pick:null, result:null, conf:null, tries:0},
    nudgeOn:true, nudgeVisible:false, nudgeShown:0,
    a:{phase:'form', kind:'', text:'', anon:true},
    b:{phase:'ask', key:null, query:'', draft:'', anon:true, note:''},
    c:{phase:'idle', signals:[], why:false, anon:false}
  };
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function now(){ return new Date().toLocaleTimeString('vi-VN',{hour12:false}); }
function log(action, detail=''){
  LOG.push({clock:now(), t:((Date.now()-S.t0)/1000).toFixed(1), opt:S.opt, action, detail});
  renderLog();
}
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

/* ============ Render ============ */
function render(){
  $('#seg').innerHTML = ORDER.map(o =>
    `<button class="seg ${S.opt===o?'on':''}" data-act="opt" data-v="${o}">Phương án ${o}${TRIED.has(o)?' ✓':''}</button>`).join('');
  $('#task').innerHTML = `<b>Tình huống:</b> Bạn đang xem lại slide 6 trước khi làm quiz và chưa hiểu rõ thuật ngữ RAG. Hãy dùng phương án này để đến lúc bạn tự tin trả lời câu quiz bên dưới. Bạn có thể tự chuyển giữa các phương án ở thanh phía trên.`;
  const sl = SLIDES[S.slide];
  $('#slide').innerHTML = `<div class="meta">Slide ${S.slide} / 7 · Bài: LLM &amp; RAG</div><h1>${sl.title}</h1>${sl.body}`;
  $('#navrow').innerHTML =
    `<button data-act="slide" data-n="${S.slide-1}" ${S.slide<=5?'disabled':''}>‹ Slide trước</button>
     <button data-act="slide" data-n="${S.slide+1}" ${S.slide>=7?'disabled':''}>Slide sau ›</button>`;
  renderQuiz();
  renderPanel();
  renderNudge();
}

function renderQuiz(){
  const q = S.q;
  let h = `<h2>Câu quiz</h2><p>${QUIZ.q}</p>`;
  h += QUIZ.opts.map((o,i)=>`<button class="opt ${q.pick===i?'sel':''}" data-act="qpick" data-i="${i}"><b>${i+1}.</b> ${esc(o)}</button>`).join('');
  h += `<div class="row"><button class="primary" data-act="qsubmit" ${q.pick===null?'disabled':''}>Trả lời</button></div>`;
  if (q.result==='bad') h += `<div class="card bad" style="margin-top:10px">Chưa đúng. Bạn có thể xem lại slide và thử lại.</div>`;
  if (q.result==='ok'){
    h += `<div class="card ok" style="margin-top:10px"><b>Đúng.</b>`;
    if (q.conf===null){
      h += `<p style="margin:8px 0 4px">Bạn thấy mình chắc chắn với câu trả lời này đến mức nào?</p>
        <div class="row"><button class="sec" data-act="conf" data-v="Chắc chắn">Chắc chắn</button>
        <button class="sec" data-act="conf" data-v="Tạm ổn">Tạm ổn</button>
        <button class="sec" data-act="conf" data-v="Đoán">Chủ yếu là đoán</button></div>`;
    } else h += ` <span class="muted">Mức chắc chắn bạn chọn: ${esc(q.conf)}.</span>`;
    h += `</div>`;
  }
  $('#quiz').innerHTML = h;
  if (q.conf!==null){
    const left = ORDER.filter(o=>!TRIED.has(o));
    $('#done').innerHTML = `<div class="card done"><b>Bạn đã hoàn thành phương án ${S.opt}.</b><br>${left.length?`Hãy thử tiếp phương án ${left.join(', ')} ở thanh phía trên.`:'Bạn đã thử cả ba phương án.'}</div>`;
  } else $('#done').innerHTML = '';
}

function badge(conf){ return `<div class="badge ${conf}">Độ chắc chắn của mình: ${CONF[conf]}</div>`; }
function explainCard(key, query){
  const t = TERMS[key];
  const head = key==='none' ? `<h3 style="margin:0 0 4px;font-size:15px">Câu hỏi: “${esc(query)}”</h3>` : `<h3 style="margin:0 0 4px;font-size:15px">${esc(t.label)}</h3>`;
  return `<div class="card">${badge(t.conf)}${head}<p style="margin:6px 0">${t.text}</p>
    ${t.caveat?`<p class="caveat">⚠ ${t.caveat}</p>`:''}
    <p class="src">Dựa trên: ${t.src}</p>
    <p class="muted small" style="margin:0">Đây là giải thích tự động, có thể chưa chính xác.</p></div>`;
}
function sentCard(p, canEdit){
  return `<div class="card ok"><b>Đã gửi cho coach.</b>
    <p class="muted small" style="margin:6px 0">Coach thường phản hồi trong vòng một ngày làm việc. Trong prototype, phản hồi hiện sau vài giây.</p>
    <div class="row">${canEdit?`<button class="sec" data-act="${p}_edit">Sửa câu hỏi</button>`:''}<button class="sec" data-act="${p}_withdraw">Thu hồi</button></div></div>`;
}
function replyCard(p, label){
  return `<div class="card coach"><b>${label}</b><p style="margin:6px 0">${COACH_REPLY}</p>
    <div class="row"><button class="sec" data-act="${p}_more">Hỏi thêm</button></div></div>`;
}

function renderPanel(){
  const el = $('#panel');
  if (S.opt==='A') el.innerHTML = panelA();
  else if (S.opt==='B') el.innerHTML = panelB();
  else el.innerHTML = panelC();
}

/* ----- Phương án A: learner tự đánh dấu, coach trả lời, AI không suy đoán ----- */
function panelA(){
  const a = S.a;
  let h = `<div class="pcard"><h2>Đánh dấu chỗ mình chưa hiểu</h2>
    <p class="muted small">Câu hỏi sẽ được gửi tới coach. Hệ thống không tự đoán bạn đang gặp khó ở đâu.</p>`;
  if (a.phase==='form'){
    const kinds = ['Thuật ngữ','Sơ đồ','Ví dụ','Khác'];
    h += `<div class="field"><label>Đang gắn với</label><span class="pill">Slide ${S.slide}</span></div>
      <div class="field"><label>Loại chỗ vướng</label>${kinds.map(k=>`<button class="chip ${a.kind===k?'sel':''}" data-act="a_kind" data-v="${k}">${k}</button>`).join('')}</div>
      <div class="field"><label for="aText">Mô tả (không bắt buộc)</label><textarea id="aText" placeholder="Bạn muốn hỏi coach điều gì?">${esc(a.text)}</textarea></div>
      <div class="field"><label>Gửi dưới dạng</label>
        <button class="chip ${a.anon?'sel':''}" data-act="a_anon" data-v="1">Ẩn danh</button>
        <button class="chip ${!a.anon?'sel':''}" data-act="a_anon" data-v="0">Kèm tên của tôi</button></div>
      <div class="preview">Coach sẽ thấy: Slide ${S.slide}${a.kind?` · ${esc(a.kind)}`:''}${a.text?` · “${esc(a.text)}”`:''} · ${a.anon?'Ẩn danh':'Có tên của bạn'}</div>
      <button class="primary" data-act="a_send">Gửi cho coach</button>`;
  } else if (a.phase==='sent') h += sentCard('a', true);
  else h += replyCard('a', 'Coach trả lời:');
  return h + `</div>`;
}

/* ----- Phương án B: learner hỏi, AI giải thích ở cấp nội dung ----- */
function panelB(){
  const b = S.b;
  let h = `<div class="pcard"><h2>Hỏi trợ lý về slide này</h2>
    <p class="muted small">Trợ lý chỉ dựa trên slide 5–7 của bài này và có thể trả lời sai.</p>
    <div class="signal">Slide ${S.slide}: ${CROWD[S.slide]} bạn khác cũng đánh dấu “chưa hiểu” (không hiển thị tên · số liệu minh hoạ)</div>`;
  if (b.phase==='ask'){
    if (b.note) h += `<p class="muted small">${esc(b.note)}</p>`;
    h += `<div class="field"><label>Chọn một thuật ngữ</label>
      <button class="chip" data-act="b_term" data-k="rag">Retrieval-Augmented Generation</button>
      <button class="chip" data-act="b_term" data-k="emb">Embedding / vector search</button>
      <button class="chip" data-act="b_term" data-k="topk">Top-k chunks</button></div>
      <div class="field"><label for="bQ">Hoặc tự hỏi</label>
      <input type="text" id="bQ" placeholder="Bạn muốn hiểu điều gì trên slide?" value="${esc(b.query)}">
      <div class="row"><button class="primary" data-act="b_ask">Hỏi</button></div></div>`;
  } else if (b.phase==='explained'){
    h += explainCard(b.key, b.query) + `<div class="row">
      <button class="sec" data-act="b_ok">Mình hiểu rồi</button>
      <button class="sec" data-act="b_draft">Vẫn chưa hiểu</button>
      <button class="sec" data-act="b_more">Hỏi phần khác</button></div>`;
  } else if (b.phase==='draft'){
    h += `<div class="field"><label for="bDraft">Trợ lý soạn nháp câu hỏi cho coach — bạn xem và sửa trước khi gửi</label>
      <textarea id="bDraft">${esc(b.draft)}</textarea></div>
      <div class="field"><label>Gửi dưới dạng</label>
        <button class="chip ${b.anon?'sel':''}" data-act="b_anon" data-v="1">Ẩn danh</button>
        <button class="chip ${!b.anon?'sel':''}" data-act="b_anon" data-v="0">Kèm tên của tôi</button></div>
      <div class="row"><button class="primary" data-act="b_send">Gửi cho coach</button>
      <button class="sec" data-act="b_cancel">Không gửi</button></div>`;
  } else if (b.phase==='sent') h += sentCard('b', false);
  else h += replyCard('b', 'Coach trả lời:');
  return h + `</div>`;
}

/* ----- Phương án C: AI chủ động hỏi thăm khi thấy tín hiệu ----- */
function panelC(){
  const c = S.c;
  let h = `<div class="pcard"><h2>Trợ lý học tập</h2>
    <p class="muted small">Mình chỉ lên tiếng khi thấy bạn có thể đang gặp khó. Mình dùng thao tác chuyển slide và thời gian ở mỗi slide trong phiên này; mình không đọc ghi chú hay nội dung chat của bạn.</p>
    <div class="row" style="margin:0 0 8px"><span class="pill">Gợi ý chủ động: ${S.nudgeOn?'Bật':'Tắt'}</span>
    <button class="link" data-act="${S.nudgeOn?'c_off':'c_on'}">${S.nudgeOn?'Tắt':'Bật lại'}</button></div>`;
  if (c.phase==='idle'){
    h += `<p class="muted">${S.nudgeOn?'Hiện chưa có gợi ý nào.':'Gợi ý chủ động đang tắt.'}</p>`;
  } else if (c.phase==='explained'){
    h += explainCard('rag') + `<div class="row">
      <button class="sec" data-act="c_ok">Mình hiểu rồi</button>
      <button class="sec" data-act="c_coach">Vẫn chưa hiểu → nhờ coach</button></div>`;
  } else if (c.phase==='preview'){
    h += `<div class="card"><b>Xem trước thẻ sẽ vào hàng chờ hỗ trợ của coach</b>
      <ul class="small" style="margin:8px 0;padding-left:18px">
        <li>Learner: ${c.anon?'Ẩn danh':'Bạn (kèm tên)'}</li>
        <li>Nội dung: Slide 6 — RAG</li>
        <li>Tín hiệu hệ thống đã thấy: ${c.signals.length?esc(c.signals.join('; ')):'không có'}</li>
        <li>Gợi ý hành động cho coach: nhắn hỏi bạn chỗ nào ở slide 6 chưa rõ</li></ul>
      <div class="field" style="margin:8px 0"><label>Gửi dưới dạng</label>
        <button class="chip ${!c.anon?'sel':''}" data-act="c_anon" data-v="0">Kèm tên của tôi</button>
        <button class="chip ${c.anon?'sel':''}" data-act="c_anon" data-v="1">Ẩn danh</button></div>
      <p class="muted small" style="margin:0 0 8px">Thẻ chỉ được gửi khi bạn bấm “Gửi cho coach”.</p>
      <div class="row"><button class="primary" data-act="c_send">Gửi cho coach</button>
      <button class="sec" data-act="c_cancel">Không gửi</button></div></div>`;
  } else if (c.phase==='sent') h += sentCard('c', false);
  else h += replyCard('c', 'Coach nhắn cho bạn:');
  return h + `</div>`;
}

function renderNudge(){
  const el = $('#nudge');
  if (S.opt!=='C' || !S.nudgeVisible){ el.hidden = true; el.innerHTML=''; return; }
  const c = S.c;
  el.hidden = false;
  el.innerHTML = `<b>Có vẻ bạn đang gặp khó ở slide 6.</b> Bạn có cần mình giúp không?
    <div><button class="link small" data-act="c_why">Vì sao mình hỏi?</button></div>
    ${c.why?`<div class="why">Mình thấy:<ul>${c.signals.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      Mình chỉ dùng thao tác chuyển slide và thời gian ở mỗi slide trong phiên này, và không báo coach nếu bạn chưa đồng ý. Đây chỉ là suy đoán, có thể sai.</div>`:''}
    <div class="row"><button class="primary" data-act="c_explain">Giải thích giúp mình</button>
    <button class="sec" data-act="c_coach">Nhờ coach hỗ trợ</button>
    <button class="sec" data-act="c_later">Để sau</button>
    <button class="sec" data-act="c_offnudge">Đừng gợi ý nữa</button></div>`;
}

function renderLog(){
  const el = $('#logp');
  if (el.hidden) return;
  el.innerHTML = `<div><button data-act="logcopy">Sao chép nhật ký</button><button data-act="logclose">Đóng (Shift+L)</button>
    <b>Nhật ký thao tác — chỉ dành cho người điều phối, không thay thế ghi chú quan sát của bạn</b></div>` +
    LOG.map(e=>`<div>${e.clock} · +${e.t}s · ${e.opt} · ${esc(e.action)} ${esc(e.detail)}</div>`).join('');
}

/* ============ Logic ============ */
function switchOpt(o){
  if (o===S.opt) return;
  clearTimers();
  const prevLog = S.opt;
  S = fresh(o);
  log('switch_option', 'từ ' + prevLog);
  render();
}
function gotoSlide(n){
  if (n<5||n>7||n===S.slide) return;
  S.slide = n; S.visits[n]++; S.dwell = 0;
  log('slide', String(n));
  if (S.opt==='C' && n===6 && S.visits[6]>=2) maybeNudge('revisit');
  render();
}
function maybeNudge(reason){
  if (S.opt!=='C' || !S.nudgeOn || S.nudgeVisible || S.nudgeShown>=2 || S.c.phase!=='idle') return;
  const sig = [];
  if (reason==='dwell') sig.push(`Đang ở slide 6 khoảng ${Math.max(S.dwell,1)} giây`);
  if (S.visits[6]>=2) sig.push(`Đã quay lại slide 6 ${S.visits[6]-1} lần`);
  S.c.signals = sig; S.c.why = false;
  S.nudgeVisible = true; S.nudgeShown++;
  log('nudge_shown', reason + ': ' + sig.join('; '));
  renderNudge();
}
setInterval(()=>{
  if (S.opt==='C' && S.slide===6 && !S.nudgeVisible && S.nudgeOn){
    S.dwell++;
    if (S.dwell>=DWELL) maybeNudge('dwell');
  }
}, 1000);

function startReply(p){
  const t = setTimeout(()=>{ if (S[p].phase==='sent'){ S[p].phase='replied'; log('coach_reply_shown'); render(); } }, 4000);
  timers.push(t);
}
function answerKey(q){
  const s = q.toLowerCase();
  if (/rag|retrieval|augment/.test(s)) return 'rag';
  if (/embed|vector/.test(s)) return 'emb';
  if (/top|chunk/.test(s)) return 'topk';
  return 'none';
}

const ACT = {
  opt:(d)=>switchOpt(d.v),
  reset:()=>{ clearTimers(); const o=S.opt; S=fresh(o); log('reset'); render(); },
  slide:(d)=>gotoSlide(parseInt(d.n,10)),
  qpick:(d)=>{ S.q.pick=parseInt(d.i,10); S.q.result=null; log('quiz_pick', String(S.q.pick+1)); render(); },
  qsubmit:()=>{ S.q.tries++; S.q.result = S.q.pick===QUIZ.correct?'ok':'bad'; log('quiz_submit', `đáp án ${S.q.pick+1} → ${S.q.result==='ok'?'đúng':'sai'} (lần ${S.q.tries})`); render(); },
  conf:(d)=>{ S.q.conf=d.v; TRIED.add(S.opt); log('confidence', d.v); log('option_done'); render(); },

  a_kind:(d)=>{ S.a.kind=d.v; log('A_kind', d.v); render(); },
  a_anon:(d)=>{ S.a.anon=d.v==='1'; log('A_anon', S.a.anon?'ẩn danh':'kèm tên'); render(); },
  a_send:()=>{ S.a.phase='sent'; log('A_send', `slide ${S.slide}; ${S.a.kind||'-'}; "${S.a.text}"; ${S.a.anon?'ẩn danh':'kèm tên'}`); startReply('a'); render(); },
  a_edit:()=>{ clearTimers(); S.a.phase='form'; log('A_edit'); render(); },
  a_withdraw:()=>{ clearTimers(); S.a=fresh('A').a; log('A_withdraw'); render(); },
  a_more:()=>{ S.a=fresh('A').a; log('A_more'); render(); },

  b_term:(d)=>{ S.b.key=d.k; S.b.query=''; S.b.phase='explained'; log('B_term', d.k); render(); },
  b_ask:()=>{ const v=(S.b.query||'').trim(); if(!v) return; S.b.key=answerKey(v); S.b.phase='explained'; log('B_ask', `"${v}" → ${S.b.key}`); render(); },
  b_ok:()=>{ S.b.phase='ask'; S.b.query=''; S.b.note='Đã ghi nhận: bạn đã hiểu phần này.'; log('B_understood'); render(); },
  b_more:()=>{ S.b.phase='ask'; S.b.query=''; S.b.note=''; log('B_ask_other'); render(); },
  b_draft:()=>{ const lb = S.b.key && S.b.key!=='none' ? TERMS[S.b.key].label : (S.b.query||'phần này');
    S.b.draft = `Mình chưa hiểu “${lb}” ở slide ${S.slide}. Mình đã đọc phần giải thích tự động nhưng vẫn chưa rõ: [bạn bổ sung chỗ còn vướng].`;
    S.b.phase='draft'; log('B_still_unclear'); render(); },
  b_anon:(d)=>{ S.b.anon=d.v==='1'; log('B_anon', S.b.anon?'ẩn danh':'kèm tên'); render(); },
  b_send:()=>{ S.b.phase='sent'; log('B_send', `"${S.b.draft}"; ${S.b.anon?'ẩn danh':'kèm tên'}`); startReply('b'); render(); },
  b_cancel:()=>{ S.b.phase='explained'; log('B_cancel_send'); render(); },
  b_withdraw:()=>{ clearTimers(); S.b.phase='draft'; log('B_withdraw'); render(); },

  c_why:()=>{ S.c.why=!S.c.why; log('C_why', S.c.why?'mở':'đóng'); renderNudge(); },
  c_explain:()=>{ S.nudgeVisible=false; S.nudgeShown=2; S.c.phase='explained'; log('C_explain'); render(); },
  c_coach:()=>{ S.nudgeVisible=false; S.nudgeShown=2; S.c.phase='preview'; log('C_to_coach_preview'); render(); },
  c_later:()=>{ S.nudgeVisible=false; log('C_later'); render(); },
  c_offnudge:()=>{ S.nudgeOn=false; S.nudgeVisible=false; log('C_dismiss_forever'); render(); },
  c_off:()=>{ S.nudgeOn=false; S.nudgeVisible=false; log('C_toggle_off'); render(); },
  c_on:()=>{ S.nudgeOn=true; S.dwell=0; log('C_toggle_on'); render(); },
  c_ok:()=>{ S.c.phase='idle'; log('C_understood'); render(); },
  c_anon:(d)=>{ S.c.anon=d.v==='1'; log('C_anon', S.c.anon?'ẩn danh':'kèm tên'); render(); },
  c_send:()=>{ S.c.phase='sent'; log('C_send', `${S.c.anon?'ẩn danh':'kèm tên'}; ${S.c.signals.join('; ')}`); startReply('c'); render(); },
  c_cancel:()=>{ S.c.phase='idle'; log('C_cancel_send'); render(); },
  c_withdraw:()=>{ clearTimers(); S.c.phase='preview'; log('C_withdraw'); render(); },
  c_more:()=>{ S.c.phase='idle'; log('C_more'); render(); },

  logcopy:()=>{ const txt = LOG.map(e=>`${e.clock}\t+${e.t}s\t${e.opt}\t${e.action}\t${e.detail}`).join('\n'); try{ navigator.clipboard.writeText(txt); }catch(_){} },
  logclose:()=>{ $('#logp').hidden=true; }
};

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset);
});
document.addEventListener('input', e=>{
  if (e.target.id==='aText') S.a.text = e.target.value;
  if (e.target.id==='bQ') S.b.query = e.target.value;
  if (e.target.id==='bDraft') S.b.draft = e.target.value;
});
document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && e.target.id==='bQ'){ e.preventDefault(); ACT.b_ask(); }
  if (e.shiftKey && (e.key==='L' || e.key==='l') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    const el = $('#logp'); el.hidden = !el.hidden; renderLog();
  }
});
if (params.get('log')==='1'){ $('#logp').hidden=false; }

log('start', `phương án ${S.opt}; ngưỡng dừng ${DWELL}s`);
render();
</script>
</body>
</html>
