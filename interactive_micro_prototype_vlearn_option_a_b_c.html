<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLearn StudyHub · Trợ lý giải nghĩa tại chỗ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Micro-prototype phương án được chọn — Option B: Trợ lý giải nghĩa tại chỗ (User + AI co-create).
  Nhóm H3201, Case C (AI Support Radar). Giao diện và nội dung dựa trên bản của Chử Trần Phương Nam (prototype_phuongnam/).
  Learner chủ động hỏi (bấm thuật ngữ, bôi đen đoạn văn, chọn câu hỏi nhanh hoặc tự gõ); AI giải thích trong phạm vi
  slide 5–7 kèm độ chắc chắn và dẫn chứng; chỉ khi learner vẫn chưa hiểu mới soạn nháp câu hỏi cho coach, learner sửa
  và tự quyết định gửi (ẩn danh hoặc kèm tên), có thể thu hồi.
  Mọi phản hồi "AI" và "coach" là nội dung soạn sẵn; không gọi mô hình hay API nào.
  Tham số URL: ?log=1 hiện nhật ký thao tác (hoặc Shift+L).
-->
<style>
:root{
  --primary:#2563eb; --primary-hover:#1d4ed8; --primary-light:#eff6ff;
  --success:#16a34a; --success-light:#f0fdf4; --warning:#d97706; --warning-light:#fffbeb; --danger:#dc2626;
  --bg-main:#f8fafc; --bg-card:#ffffff; --text-main:#0f172a; --text-muted:#64748b; --border:#e2e8f0;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-md:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
  --radius:10px; --radius-sm:6px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
body{font-family:var(--font);background:var(--bg-main);color:var(--text-main);line-height:1.5;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}

/* NAVBAR */
.navbar{background:var(--bg-card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.nav-left,.nav-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:6px;font-size:1.05rem;color:var(--primary)}
.logo-icon{font-size:1.3rem}
.badge{display:inline-flex;align-items:center;padding:3px 8px;font-size:.75rem;font-weight:600;border-radius:9999px}
.track-badge{background:#e0e7ff;color:#3730a3}
.badge-hint{background:#fef3c7;color:#92400e}
.badge-time{background:#f1f5f9;color:#475569;font-family:var(--font-mono)}
.divider{color:var(--border)}
.lesson-title{font-size:.85rem;font-weight:500;color:var(--text-muted)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:#4338ca;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}

/* TASK */
.task-bar{max-width:1560px;margin:16px auto 0;padding:0 24px}
.task-inner{background:var(--primary-light);border:1px solid #bfdbfe;border-radius:var(--radius);padding:12px 16px;font-size:.88rem;color:#1e3a8a}

/* LAYOUT */
.main-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;padding:16px 24px 40px;max-width:1560px;margin:0 auto}
.content-area{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.slide-card{position:relative;overflow:visible}

/* SLIDE */
.slide-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border);background:#fafafa;border-radius:var(--radius) var(--radius) 0 0}
.slide-pagination{display:flex;align-items:center;gap:12px}
.slide-status-tags{display:flex;gap:8px;flex-wrap:wrap}
.slide-nav-btn{background:#fff;border:1px solid var(--border);padding:4px 10px;font-size:.8rem;border-radius:var(--radius-sm);font-weight:500}
.slide-nav-btn:hover:not(:disabled){background:#f1f5f9}
.slide-nav-btn:disabled{opacity:.4;cursor:default}
.slide-number{font-size:.85rem;color:var(--text-muted)}
.slide-canvas{padding:28px 32px;background:linear-gradient(135deg,#fff 0%,#f8fafc 100%);min-height:400px}
.slide-meta-tag{font-size:.75rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.slide-title{font-size:1.45rem;font-weight:700;color:#1e293b;margin-bottom:4px}
.slide-subtitle{font-size:.9rem;color:var(--text-muted);margin-bottom:20px}
.slide-content-blocks{display:flex;flex-direction:column;gap:16px}
.content-block{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;font-size:.88rem;color:#334155;line-height:1.6}
.content-block ul{margin:4px 0 0 18px}
.content-block li{margin:4px 0}
.block-header{font-size:.82rem;font-weight:700;color:#0f172a;margin-bottom:6px;text-transform:uppercase}
.callout-block{border-left:4px solid var(--primary);background:#f0f7ff}
.term{display:inline;border:0;border-bottom:2px dashed #3b82f6;color:#1d4ed8;font-weight:600;padding:0 3px;border-radius:3px;background:rgba(59,130,246,.08);transition:all .2s;cursor:pointer;font-size:inherit;line-height:inherit}
.term:hover{background:#dbeafe;color:#1e40af;border-bottom-style:solid}
.term-plain{font-weight:600;color:#1e293b}
.rag-diagram-grid{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px;margin:4px 0}
.rag-step-box{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);height:100%}
.rag-step-box.highlight-box{border-color:#3b82f6;background:#f0f7ff}
.step-num{font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--primary);margin-bottom:4px}
.step-title{font-size:.92rem;font-weight:700;color:#0f172a;margin-bottom:6px}
.step-desc{font-size:.8rem;color:#475569;line-height:1.45}
.rag-arrow{font-size:1.3rem;color:#94a3b8;font-weight:bold;text-align:center}
.pipeline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pipe-step{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:.82rem;font-weight:600;color:#1e293b;box-shadow:var(--shadow-sm)}
.pipe-step b{color:var(--primary);margin-right:4px}
.pipe-arrow{color:#94a3b8;font-weight:bold}

/* SELECTION POPUP */
.text-selection-popup{position:absolute;background:#1e293b;border-radius:var(--radius-sm);padding:4px;display:flex;gap:4px;box-shadow:var(--shadow-lg);z-index:50;animation:fadeIn .15s ease-out}
.btn-selection-action{background:transparent;border:none;color:#fff;font-size:.78rem;font-weight:600;padding:6px 10px;border-radius:4px}
.btn-selection-action:hover{background:#3b82f6}

/* SLIDE FOOTER */
.slide-footer-actions{padding:14px 20px;background:#fff;border-top:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius)}
.action-panel{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.action-label{font-size:.85rem;font-weight:600;color:#334155;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.concept-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--primary-light);border:1px solid #bfdbfe;color:var(--primary);padding:5px 12px;font-size:.8rem;font-weight:600;border-radius:9999px;transition:all .2s}
.chip:hover{background:#dbeafe;border-color:#93c5fd;transform:translateY(-1px)}
.chip.sel{background:var(--primary);border-color:var(--primary);color:#fff}

/* QUIZ */
.quiz-container{padding:20px 24px}
.quiz-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.quiz-badge{background:#e2e8f0;color:#475569;font-size:.75rem;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:4px;margin-bottom:4px;display:inline-block}
.quiz-header h3{font-size:1.05rem;color:#0f172a}
.quiz-status{font-size:.8rem;font-weight:600;color:var(--text-muted)}
.quiz-status.ok{color:var(--success)} .quiz-status.bad{color:var(--danger)}
.quiz-question{font-size:.95rem;color:#1e293b;margin-bottom:16px}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.quiz-option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;font-size:.88rem;color:#1e293b;transition:all .2s}
.quiz-option:hover{border-color:#94a3b8;background:#f8fafc}
.quiz-option.selected{border-color:var(--primary);background:var(--primary-light)}
.quiz-option.correct{border-color:var(--success);background:var(--success-light)}
.quiz-option.incorrect{border-color:var(--danger);background:#fef2f2}
.quiz-feedback{padding:12px 16px;border-radius:var(--radius-sm);font-size:.88rem;line-height:1.45;margin-top:12px}
.quiz-feedback.success{background:var(--success-light);border:1px solid #bbf7d0;color:#166534}
.quiz-feedback.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.quiz-footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.done-card{padding:14px 18px;background:var(--success-light);border:1px solid #bbf7d0;color:#166534;font-size:.88rem;border-radius:var(--radius)}

/* SIDEBAR */
.sidebar-area{position:sticky;top:74px;align-self:start;height:calc(100vh - 96px);min-height:520px}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;height:100%;min-height:0;box-shadow:var(--shadow-sm)}
.drawer-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fafafa;border-radius:var(--radius) var(--radius) 0 0}
.drawer-title{display:flex;align-items:center;gap:10px}
.bot-icon{font-size:1.5rem}
.drawer-header h4{font-size:.95rem;font-weight:700;color:#0f172a}
.drawer-scope{font-size:.72rem;color:var(--text-muted)}
.drawer-body{flex:1;min-height:0;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;background:#fdfdfd}
.drawer-footer{padding:12px 16px;border-top:1px solid var(--border);background:#fff;border-radius:0 0 var(--radius) var(--radius)}
.welcome-box{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:var(--radius-sm);padding:14px;font-size:.82rem;color:#475569}
.welcome-badge{font-weight:700;color:var(--primary);margin-bottom:6px}
.help-methods{margin:8px 0 10px 16px;display:flex;flex-direction:column;gap:4px}
.quick-questions{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.quick-q-btn{text-align:left;background:#fff;border:1px solid var(--border);padding:8px 12px;font-size:.8rem;border-radius:var(--radius-sm);color:#1e293b;font-weight:500;transition:all .2s}
.quick-q-btn:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.crowd{background:#f1f5f9;border-radius:var(--radius-sm);padding:8px 12px;font-size:.78rem;color:#475569}
.empty-icon{width:44px;height:44px;background:var(--primary-light);color:var(--primary);border-radius:12px;display:grid;place-items:center;font-size:1.3rem;margin-bottom:10px}
.panel-h{font-size:1rem;font-weight:700;color:#0f172a;margin-bottom:6px}
.muted{color:var(--text-muted)} .small{font-size:.8rem}
.info-box{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:.8rem;color:#475569}
.warn-box{background:var(--warning-light);border:1px solid #fde68a;border-radius:var(--radius-sm);padding:8px 12px;font-size:.78rem;color:#92400e}

/* CHAT */
.chat-messages{display:flex;flex-direction:column;gap:16px}
.user-message{align-self:flex-end;max-width:92%}
.user-bubble{background:var(--primary);color:#fff;padding:10px 14px;border-radius:12px 12px 2px 12px;font-size:.85rem}
.bot-message{align-self:stretch}
.bot-bubble{background:#fff;border:1px solid var(--border);border-radius:12px 12px 12px 2px;padding:14px;font-size:.84rem;color:#1e293b;box-shadow:var(--shadow-sm)}
.typing{font-size:.8rem;color:var(--text-muted);font-style:italic}
.uncertainty-tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:8px;border:1px solid}
.uncertainty-tag.high{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.uncertainty-tag.mid{background:var(--warning-light);border-color:#fde68a;color:#92400e}
.uncertainty-tag.low{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.ex-term{font-size:.92rem;font-weight:700;color:#1e293b;margin-bottom:6px}
.ex-analogy{background:#f8fafc;border-left:3px solid #3b82f6;padding:8px 10px;border-radius:4px;font-size:.82rem;margin-bottom:8px}
.ex-role{font-size:.83rem;line-height:1.5;color:#334155;margin-bottom:8px}
.ex-note{font-size:.78rem;color:#b45309;background:#fffbeb;padding:6px 10px;border-radius:4px}
.grounding-source{display:block;margin-top:8px;padding-top:8px;border-top:1px solid #f1f5f9;font-size:.75rem;color:#64748b}
.bot-actions-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chat-input-form{display:flex;gap:8px}
.chat-input-form input{flex:1;min-width:0;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.85rem;outline:none}
.chat-input-form input:focus{border-color:var(--primary)}

/* FORMS & TICKETS */
.form-group{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.form-group>label,.form-label{font-size:.82rem;font-weight:600;color:#334155}
.form-control{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.85rem;outline:none;width:100%;background:#fff}
.form-control:focus{border-color:var(--primary)}
textarea.form-control{min-height:88px;resize:vertical}
.radio-label{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#334155;cursor:pointer;font-weight:400}
.ticket-preview-box{background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:var(--radius-sm);padding:14px}
.ticket-badge{background:#e0e7ff;color:#3730a3;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:8px;display:inline-block}
.ticket-field{font-size:.82rem;color:#334155;margin-bottom:6px}
.status-card{border-radius:var(--radius-sm);padding:12px 14px;font-size:.84rem}
.status-card.sent{background:var(--success-light);border:1px solid #bbf7d0;color:#166534}
.status-card.coach{background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);color:#1e293b}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;font-size:.85rem;font-weight:600;border-radius:var(--radius-sm);border:none;transition:all .2s}
.btn:disabled{opacity:.45;cursor:default}
.btn-sm{padding:5px 10px;font-size:.78rem}
.btn-wide{width:100%}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-secondary{background:#e2e8f0;color:#334155}.btn-secondary:hover{background:#cbd5e1}
.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{background:#b45309}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#15803d}
.btn-outline-secondary{background:transparent;border:1px solid var(--border);color:#475569}.btn-outline-secondary:hover{background:#f1f5f9}
.btn-ghost{background:transparent;color:#64748b}.btn-ghost:hover{background:#f1f5f9;color:#0f172a}
.btn-danger-ghost{background:transparent;color:#b91c1c;border:1px solid #fecaca}.btn-danger-ghost:hover{background:#fef2f2}
.btn-link{background:transparent;border:none;color:var(--primary);font-size:.78rem;text-decoration:underline;padding:0}
.btn-icon{background:transparent;border:none;font-size:1.05rem;color:#94a3b8;padding:4px}.btn-icon:hover{color:#0f172a}


/* LOG */
.logp{position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:#10131c;color:#dfe5f5;font:12px/1.5 var(--font-mono);padding:10px 16px;z-index:2000}
.logp button{margin-right:8px;font-size:12px}

@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

@media (max-width:1024px){
  .main-layout{grid-template-columns:minmax(0,1fr)}
  .sidebar-area{position:static;height:auto;min-height:0}
  .panel{height:auto}
  .drawer-body{max-height:none}
  .rag-diagram-grid{grid-template-columns:minmax(0,1fr)}
  .rag-arrow{transform:rotate(90deg)}
}
@media (max-width:640px){
  .navbar,.main-layout,.task-bar{padding-left:16px;padding-right:16px}
  .slide-canvas{padding:20px 16px}
  .lesson-title,.divider{display:none}
}
</style>
</head>
<body>
<header class="navbar">
  <div class="nav-left">
    <div class="logo"><span class="logo-icon">⚡</span><span>VLearn <strong>StudyHub</strong></span></div>
    <span class="badge track-badge">AI Thực Chiến · Track chuyên sâu</span>
    <span class="divider">/</span>
    <span class="lesson-title">Bài 4: Kiến trúc xử lý tri thức</span>
  </div>
  <div class="nav-right">
    <button class="btn btn-secondary btn-sm" data-act="reset">↺ Bắt đầu lại</button>
    <div class="user-avatar" title="Học viên">HV</div>
  </div>
</header>

<div class="task-bar"><div class="task-inner" id="task"></div></div>

<main class="main-layout">
  <section class="content-area">
    <div class="card slide-card">
      <div class="slide-header">
        <div class="slide-pagination" id="pager"></div>
        <div class="slide-status-tags" id="slideTags"></div>
      </div>
      <div class="slide-canvas" id="slideCanvas"></div>
      <div class="text-selection-popup" id="selPopup" hidden></div>
      <div class="slide-footer-actions" id="slideActions"></div>
    </div>
    <div class="card quiz-container" id="quiz"></div>
    <div id="done"></div>
  </section>
  <aside class="sidebar-area" id="sidebar" aria-live="polite"></aside>
</main>

<div class="logp" id="logp" hidden></div>

<script>
const params = new URLSearchParams(location.search);

/* ===================== Nội dung dùng chung ===================== */
// [[key|chữ hiển thị]] = thuật ngữ trên slide; learner bấm vào để trợ lý giải thích.
const SLIDES = {
  5: {
    meta: 'Track chuyên sâu · Bài 4: Kiến trúc xử lý tri thức',
    title: 'Giới hạn của mô hình ngôn ngữ lớn (LLM)',
    subtitle: 'Vì sao một LLM "giỏi" vẫn có thể trả lời sai về tài liệu của chính tổ chức bạn',
    body: `
      <div class="content-block">
        <div class="block-header">1. Kiến thức bị đóng băng</div>
        Mỗi LLM chỉ biết dữ liệu đến thời điểm huấn luyện — gọi là [[cutoff|Knowledge Cutoff]]. Thông tin mới hơn mốc này, mô hình không tự biết.
      </div>
      <div class="content-block">
        <div class="block-header">2. Trả lời tự tin nhưng sai</div>
        Khi thiếu thông tin, mô hình vẫn có thể sinh ra câu trả lời trôi chảy nhưng không có thật — hiện tượng [[hallu|Hallucination (ảo giác AI)]].
      </div>
      <div class="content-block">
        <div class="block-header">3. Không biết dữ liệu nội bộ</div>
        Tài liệu nội bộ, chính sách riêng, ghi chú lớp học… không nằm trong dữ liệu huấn luyện. Cách cập nhật truyền thống là [[finetune|Fine-tuning]] — tốn kém và chậm.

/* ===================== Trạng thái ===================== */
const LOG = [];
let timers = [];
let S = fresh();

function fresh(){
  return {
    t0:Date.now(), slide:6, slideSec:0, sel:'',
    q:{pick:null, result:null, conf:null, tries:0},
    b:{phase:'chat', msgs:[], input:'', typing:false, key:null, draft:'', anon:true, scroll:false}
  };
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(action, detail=''){
  LOG.push({clock:new Date().toLocaleTimeString('vi-VN',{hour12:false}), t:((Date.now()-S.t0)/1000).toFixed(1), action, detail});
  renderLog();
}
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function matchConcept(text){
  const s = text.toLowerCase();
  return MATCH_ORDER.find(k => CONCEPTS[k].kw.some(w => s.includes(w))) || null;
}

/* ===================== Render ===================== */
function render(){
  $('#task').innerHTML = `<strong>Tình huống:</strong> Bạn đang xem lại slide 6 trước khi làm quiz và chưa hiểu rõ thuật ngữ RAG. Hãy dùng trợ lý bên phải để đến lúc bạn tự tin trả lời câu quiz bên dưới slide.`;
  renderSlide(); renderActions(); renderQuiz(); renderSidebar();
  $('#selPopup').hidden = true;
}

function renderSlide(){
  const sl = SLIDES[S.slide];
  $('#pager').innerHTML = `
    <button class="slide-nav-btn" data-act="slide" data-n="${S.slide-1}" ${S.slide<=5?'disabled':''}>◀ Slide trước</button>
    <span class="slide-number">Slide <strong>${S.slide}</strong> / 7</span>
    <button class="slide-nav-btn" data-act="slide" data-n="${S.slide+1}" ${S.slide>=7?'disabled':''}>Slide tiếp ▶</button>`;
  renderTags();
  const body = sl.body.replace(/\[\[(\w+)\|([^\]]+)\]\]/g, (_, k, t) =>
    `<button class="term" data-act="b_term" data-k="${k}" title="Bấm để trợ lý giải thích">${t}</button>`);
  $('#slideCanvas').innerHTML = `<div class="slide-meta-tag">${sl.meta}</div>
    <h2 class="slide-title">${sl.title}</h2><p class="slide-subtitle">${sl.subtitle}</p>
    <div class="slide-content-blocks">${body}</div>`;
}
function renderTags(){
  const m = String(Math.floor(S.slideSec/60)).padStart(2,'0'), s = String(S.slideSec%60).padStart(2,'0');
  $('#slideTags').innerHTML = `<span class="badge badge-hint">💡 Bấm thuật ngữ hoặc bôi đen đoạn văn để hỏi trợ lý</span><span class="badge badge-time">⏱️ ${m}:${s}</span>`;
}
function renderActions(){
  $('#slideActions').innerHTML = `<div class="action-panel"><span class="action-label">🤖 Khái niệm hay gặp khó ở slide này:
    <span class="concept-chips">${CHIPS[S.slide].map(k=>`<button class="chip" data-act="b_term" data-k="${k}">${esc(CONCEPTS[k].term.split(' (')[0].split(' — ')[0])} là gì?</button>`).join('')}</span></span></div>`;
}

function renderQuiz(){
  const q = S.q, answered = q.result!==null;
  let h = `<div class="quiz-header"><div><span class="quiz-badge">Kiểm tra mức độ hiểu bài</span><h3>Câu hỏi củng cố (dựa trên slide 6–7)</h3></div>
    <span class="quiz-status ${q.result==='ok'?'ok':q.result==='bad'?'bad':''}">${q.result==='ok'?'✅ Đúng':q.result==='bad'?'❌ Chưa đúng':'Chưa nộp bài'}</span></div>
    <p class="quiz-question"><strong>${QUIZ.q}</strong></p><div class="quiz-options">`;
  h += QUIZ.opts.map((o,i)=>{
    let cls = q.pick===i ? 'selected' : '';
    if (answered && q.pick===i) cls = q.result==='ok' ? 'correct' : 'incorrect';
    return `<button class="quiz-option ${cls}" data-act="qpick" data-i="${i}"><strong>${'ABCD'[i]}.</strong><span>${esc(o)}</span></button>`;
  }).join('') + `</div>`;
  if (q.result==='bad') h += `<div class="quiz-feedback error"><strong>Chưa đúng.</strong> Bạn có thể xem lại slide hoặc hỏi trợ lý, rồi chọn lại và kiểm tra lần nữa.</div>`;
  if (q.result==='ok'){
    h += `<div class="quiz-feedback success"><strong>🎉 Chính xác!</strong> Augmentation là đưa tài liệu vừa truy xuất vào ngữ cảnh của prompt — mô hình không bị huấn luyện lại.`;
    h += q.conf===null
      ? `<p style="margin-top:8px">Bạn chắc chắn với câu trả lời này đến mức nào?</p>
         <div class="row"><button class="btn btn-sm btn-outline-secondary" data-act="conf" data-v="Chắc chắn">Chắc chắn</button>
         <button class="btn btn-sm btn-outline-secondary" data-act="conf" data-v="Tạm ổn">Tạm ổn</button>
         <button class="btn btn-sm btn-outline-secondary" data-act="conf" data-v="Chủ yếu là đoán">Chủ yếu là đoán</button></div>`
      : ` <span>Mức chắc chắn bạn chọn: <strong>${esc(q.conf)}</strong>.</span>`;
    h += `</div>`;
  }
  h += `<div class="quiz-footer"><button class="btn btn-success" data-act="qsubmit" ${q.pick===null||q.result==='ok'?'disabled':''}>Kiểm tra câu trả lời</button></div>`;
  $('#quiz').innerHTML = h;
  $('#done').innerHTML = q.conf!==null ? `<div class="done-card"><strong>Bạn đã hoàn thành bài ôn tập.</strong> Bấm "↺ Bắt đầu lại" để thử lại từ đầu.</div>` : '';
}

    <div class="ex-term">📌 ${esc(c.term)}</div>
    <div class="ex-analogy"><strong>💡 Hiểu đơn giản:</strong> ${c.analogy}</div>
    <div class="ex-role"><strong>🎯 Trong bài này:</strong> ${c.role}</div>
    <div class="ex-note">${c.note}</div>
    <span class="grounding-source">📚 Dẫn chứng: ${c.src} · Giải thích tự động, có thể chưa chính xác.</span>
    ${actions}</div>`;
}
function previewBox(label, html){ return `<div class="ticket-preview-box"><span class="ticket-badge">${label}</span><div class="ticket-field">${html}</div></div>`; }

function renderSidebar(){
  const b = S.b;
  let body = `<div class="crowd">👥 Slide ${S.slide}: ${CROWD[S.slide]} bạn khác cũng đánh dấu "chưa hiểu" (không hiển thị tên · số liệu minh hoạ)</div>`;
  let footer = '';
  if (b.phase==='chat'){
    if (!b.msgs.length) body += `<div class="welcome-box"><div class="welcome-badge">💡 Cách nhận giải thích</div>
      <p>Bạn chưa hiểu khái niệm nào trên slide? Chọn một cách:</p><ul class="help-methods">
        <li>👉 <strong>Bấm vào thuật ngữ gạch chân</strong> trên slide.</li>
        <li>👉 <strong>Bôi đen bất kỳ đoạn văn nào</strong> trên slide.</li>
        <li>👉 Chọn câu hỏi nhanh hoặc tự gõ câu hỏi bên dưới.</li></ul>
      <div class="quick-questions">
        <button class="quick-q-btn" data-act="b_term" data-k="rag">🧭 RAG gồm những bước nào?</button>
        <button class="quick-q-btn" data-act="b_term" data-k="augment">🧩 Bước Augmentation thực chất làm gì?</button>
        <button class="quick-q-btn" data-act="b_term" data-k="finetune">🔄 RAG khác gì Fine-tuning?</button></div></div>`;
    body += `<div class="chat-messages">${b.msgs.map((m,i)=> m.type==='user'
      ? `<div class="user-message"><div class="user-bubble">❓ ${esc(m.text)}</div></div>`
      : `<div class="bot-message">${explainCard(m.key, m.query, i===b.msgs.length-1 ? `<div class="bot-actions-row">
          <button class="btn btn-success btn-sm" data-act="b_ok">✅ Mình hiểu rồi → làm quiz</button>
          <button class="btn btn-outline-secondary btn-sm" data-act="b_draft">❓ Vẫn chưa hiểu → nhờ coach</button></div>` : '')}</div>`).join('')}
      ${b.typing?'<div class="typing">Trợ lý đang soạn giải thích…</div>':''}</div>`;
    footer = `<form class="chat-input-form" data-form="b_ask"><input type="text" id="bQ" placeholder="Nhập thuật ngữ hoặc câu hỏi về slide..." value="${esc(b.input)}" autocomplete="off">
      <button type="submit" class="btn btn-primary">Giải thích</button></form>`;
  } else if (b.phase==='ticket'){
    const k = b.key;
    body += `<div class="ticket-preview-box"><span class="ticket-badge">Bản nháp do trợ lý soạn — bạn sửa thoải mái</span>
      <div class="ticket-field"><strong>📍 Vị trí:</strong> Slide ${S.slide} — ${esc(SLIDES[S.slide].title)}</div>
      <div class="ticket-field"><strong>🎯 Khái niệm:</strong> ${k?esc(CONCEPTS[k].term):'Câu hỏi tự do'}</div>
      <div class="ticket-field"><strong>🤖 Trạng thái:</strong> Đã đọc giải thích tự động nhưng vẫn chưa rõ.</div>
      <div class="form-group"><label for="bDraft">Nội dung gửi coach</label><textarea id="bDraft" class="form-control">${esc(b.draft)}</textarea></div></div>
      <div class="form-group"><span class="form-label">Gửi dưới dạng</span>
        <label class="radio-label"><input type="radio" name="b_id" data-act="b_anon" data-v="1" ${b.anon?'checked':''}> 🕵️ Ẩn danh — coach không thấy tên bạn</label>
        <label class="radio-label"><input type="radio" name="b_id" data-act="b_anon" data-v="0" ${!b.anon?'checked':''}> 👤 Kèm tên của tôi</label></div>
      <p class="muted small" style="margin-top:8px">Câu hỏi chỉ được gửi khi bạn bấm "Gửi cho coach".</p>
      <div class="row"><button class="btn btn-primary" data-act="b_send">Gửi cho coach</button>
      <button class="btn btn-ghost" data-act="b_cancel">Không gửi, quay lại trợ lý</button></div>`;
  } else if (b.phase==='sent'){
    body += previewBox('Câu hỏi của bạn', esc(b.draft) + `<br>${b.anon?'🕵️ Ẩn danh':'👤 Có tên của bạn'}`) +
      `<div class="status-card sent"><strong>📤 Đã gửi cho coach.</strong>
      <p class="small" style="margin-top:4px">Coach thường phản hồi trong vòng một ngày làm việc. Trong bản thử này, phản hồi hiện sau vài giây.</p>
      <div class="row"><button class="btn btn-sm btn-danger-ghost" data-act="b_withdraw">Thu hồi</button></div></div>`;
  } else {
    body += previewBox('Câu hỏi của bạn', esc(b.draft)) +
      `<div class="status-card coach"><strong>👩‍🏫 Coach trả lời:</strong><p style="margin-top:6px">${COACH_REPLY}</p>
      <div class="row"><button class="btn btn-sm btn-outline-secondary" data-act="b_more">Hỏi tiếp trợ lý</button>
      <button class="btn btn-sm btn-primary" data-act="b_ok">Làm quiz</button></div></div>`;
  }
  $('#sidebar').innerHTML = `<div class="panel"><div class="drawer-header"><div class="drawer-title"><span class="bot-icon">🤖</span>
    <div><h4>Trợ lý giải nghĩa tại chỗ</h4><span class="drawer-scope">Chỉ dựa trên slide 5–7 của bài này · có thể trả lời sai</span></div></div></div>
    <div class="drawer-body" id="drawerBody">${body}</div>${footer?`<div class="drawer-footer">${footer}</div>`:''}</div>`;
  if (b.scroll){ const d = $('#drawerBody'); if (d) d.scrollTop = d.scrollHeight; b.scroll = false; }
}

function renderLog(){
  const el = $('#logp');
  if (el.hidden) return;
  el.innerHTML = `<div><button data-act="logcopy">Sao chép nhật ký</button><button data-act="logclose">Đóng (Shift+L)</button>
    <b>Nhật ký thao tác — chỉ dành cho người facilitate, không thay thế ghi chú quan sát</b></div>` +
    LOG.map(e=>`<div>${e.clock} · +${e.t}s · ${esc(e.action)} ${esc(e.detail)}</div>`).join('');
}

/* ===================== Logic ===================== */
setInterval(()=>{ S.slideSec++; renderTags(); }, 1000);

function ask(query, key){
  if (S.b.phase!=='chat' || S.b.typing) return;
  S.b.msgs.push({type:'user', text:query});
  S.b.typing = true; S.b.scroll = true; S.b.input = '';
  renderSidebar();
  later(()=>{ S.b.typing=false; S.b.key=key; S.b.msgs.push({type:'bot', key, query}); S.b.scroll=true; renderSidebar(); }, 450);
}

const ACT = {
  reset:()=>{ clearTimers(); S=fresh(); log('reset'); render(); },
  slide:d=>{ const n=parseInt(d.n,10); if (n<5||n>7||n===S.slide) return; S.slide=n; S.slideSec=0; log('slide', String(n)); render(); },
  qpick:d=>{ if (S.q.result==='ok') return; S.q.pick=parseInt(d.i,10); S.q.result=null; log('quiz_pick', 'ABCD'[S.q.pick]); renderQuiz(); },
  qsubmit:()=>{ if (S.q.pick===null) return; S.q.tries++; S.q.result = S.q.pick===QUIZ.correct?'ok':'bad';
    log('quiz_submit', `${'ABCD'[S.q.pick]} → ${S.q.result==='ok'?'đúng':'sai'} (lần ${S.q.tries})`); renderQuiz(); },
  conf:d=>{ S.q.conf=d.v; log('confidence', d.v); renderQuiz(); },

  b_term:d=>{ const c=CONCEPTS[d.k]; log('term', d.k); ask(`Giải thích giúp mình: ${c.term}`, d.k); },
  b_sel:()=>{ const t=S.sel; $('#selPopup').hidden=true; const k=matchConcept(t); log('explain_selection', `"${t}" → ${k||'none'}`); ask(`Giải thích đoạn: “${t.length>80?t.slice(0,80)+'…':t}”`, k); },
  b_ask:()=>{ const v=(S.b.input||'').trim(); if (!v) return; const k=matchConcept(v); log('ask', `"${v}" → ${k||'none'}`); ask(v, k); },
  b_ok:()=>{ log('to_quiz', S.b.key||'none'); $('#quiz').scrollIntoView({behavior:'smooth', block:'start'}); },
  b_draft:()=>{ const k=S.b.key; const last=S.b.msgs[S.b.msgs.length-1];
    S.b.draft = k ? CONCEPTS[k].draft : `Em đang đọc slide ${S.slide} và chưa hiểu: "${last?last.query:''}". Nhờ coach giải thích thêm giúp em ạ.`;
    S.b.phase='ticket'; log('still_unclear', k||'none'); renderSidebar(); },
  b_anon:d=>{ S.b.anon=d.v==='1'; log('identity', S.b.anon?'ẩn danh':'kèm tên'); renderSidebar(); },
  b_send:()=>{ S.b.phase='sent'; log('send_coach', `"${S.b.draft}"; ${S.b.anon?'ẩn danh':'kèm tên'}`);
    later(()=>{ if (S.b.phase==='sent'){ S.b.phase='replied'; log('coach_reply_shown'); renderSidebar(); } }, 4000); renderSidebar(); },
  b_cancel:()=>{ S.b.phase='chat'; S.b.scroll=true; log('cancel_send'); renderSidebar(); },
  b_withdraw:()=>{ clearTimers(); S.b.phase='ticket'; log('withdraw'); renderSidebar(); },
  b_more:()=>{ S.b.phase='chat'; S.b.scroll=true; log('ask_more'); renderSidebar(); },

  logcopy:()=>{ const txt = LOG.map(e=>`${e.clock}\t+${e.t}s\t${e.action}\t${e.detail}`).join('\n'); try{ navigator.clipboard.writeText(txt); }catch(_){} },
  logclose:()=>{ $('#logp').hidden=true; }
};

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset);
});
document.addEventListener('submit', e=>{
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = ACT[f.dataset.form];
  if (fn) fn(f.dataset);
});
document.addEventListener('input', e=>{
  if (e.target.id==='bQ') S.b.input = e.target.value;
  if (e.target.id==='bDraft') S.b.draft = e.target.value;
});

// Bôi đen đoạn văn trên slide → hỏi trợ lý
document.addEventListener('mouseup', e=>{
  const pop = $('#selPopup');
  if (pop.contains(e.target)) return;
  setTimeout(()=>{
    const sel = window.getSelection();
    const text = sel ? sel.toString().trim().replace(/\s+/g,' ') : '';
    if (text.length<3 || !sel.rangeCount || !$('#slideCanvas').contains(sel.anchorNode)){ pop.hidden = true; return; }
    S.sel = text.slice(0, 300);
    const r = sel.getRangeAt(0).getBoundingClientRect(), box = $('.slide-card').getBoundingClientRect();
    pop.innerHTML = `<button class="btn-selection-action" data-act="b_sel">🤖 Giải thích đoạn này</button>`;
    pop.style.top = Math.max(4, r.top - box.top - 42) + 'px';
    pop.style.left = Math.max(4, Math.min(r.left - box.left, box.width - 180)) + 'px';
    pop.hidden = false;
  }, 0);
});
document.addEventListener('keydown', e=>{
  if (e.shiftKey && (e.key==='L' || e.key==='l') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    const el = $('#logp'); el.hidden = !el.hidden; renderLog();
  }
});
if (params.get('log')==='1') $('#logp').hidden = false;

log('start');
render();
</script>
</body>
</html>
